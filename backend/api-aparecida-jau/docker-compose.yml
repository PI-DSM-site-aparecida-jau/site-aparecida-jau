services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paroquia-api
    ports:
      - "5220:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AppDbConnectionString: "server=mysql;database=DB_APARECIDA_JAU;user=root;password=${MYSQL_ROOT_PASSWORD};port=3306;"
      MongoDbSettings__ConnectionString: "mongodb://admin:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin"
      MongoDbSettings__DatabaseName: paroquiaDB
      MongoDbSettings__AlbunsCollectionName: albuns
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - ./wwwroot:/app/wwwroot
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: paroquia-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: DB_APARECIDA_JAU
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mongo:
    image: mongo:6
    container_name: paroquia-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')", "--username", "admin", "--password", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend/site-aparecida-jau
      dockerfile: Dockerfile
    container_name: paroquia-frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mysql-data:
  mongo-data: